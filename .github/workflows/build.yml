name: build

# 触发方式见 ADR-0011：只手动触发与打 tag 发版，不挂 PR 门禁。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # 只打印环境，不判失败：windows-11-arm 镜像内容会变，出问题时靠这段日志定位。
      - name: Toolchain inventory
        shell: pwsh
        continue-on-error: true
        run: |
          "OS: $([System.Environment]::OSVersion.VersionString)"
          "PROCESSOR_ARCHITECTURE: $env:PROCESSOR_ARCHITECTURE"
          "cmake: $((cmake --version | Select-Object -First 1))"
          "ninja: $((ninja --version))"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            "VS: $(& $vswhere -latest -products * -property installationVersion)"
            "ARM64 tools: $(& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath)"
          } else { "vswhere: not found" }

      # 版本号漂移即红：.iss 的 AppVersion 必须等于 src/version.h（pack.cmd 会写，但仓库里要保持一致）
      - name: Version drift check
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\sync-version.ps1 -Check

      - name: Build
        shell: cmd
        run: tools\build.cmd Release ${{ matrix.arch }}

      # 机器码断言：CI 存在的意义之一就是防止"ARM64 构建悄悄产出 x64"这类错误
      - name: Assert PE machine type
        shell: pwsh
        run: |
          $want = @{ x64 = 0x8664; arm64 = 0xAA64 }['${{ matrix.arch }}']
          if (-not $want) { throw "unknown arch" }
          foreach ($f in 'apkthumb.dll','apkprop.dll','apkinfo.exe') {
            $p = "out/${{ matrix.arch }}/$f"
            if (-not (Test-Path $p)) { throw "missing $p" }
            $fs = [IO.File]::OpenRead($p)
            $br = New-Object IO.BinaryReader($fs)
            $fs.Position = 0x3C; $pe = $br.ReadInt32()
            $fs.Position = $pe + 4; $machine = $br.ReadUInt16()
            $br.Close(); $fs.Close()
            if ($machine -ne $want) { throw ("{0} machine=0x{1:X4}, expected 0x{2:X4}" -f $f, $machine, $want) }
            "ok {0} machine=0x{1:X4}" -f $f, $machine
          }

      # 不需要夹具、不需要桌面会话的那部分测试；夹具是入库的小样本（tests/fixtures/ci）
      - name: Self-test
        shell: cmd
        run: out\${{ matrix.arch }}\propsheet_model_test.exe --selftest

      # 缩略图 smoke：5 个入库样本（PNG/WebP/自适应/deflate-arsc/无图标）
      # 两条腿的托管镜像对 WebP 的支持不一致（见 ADR-0011 修订段），所以失败数允许 1–2；
      # 300 ms 是"每个缩略图"的预算，只对热路径（--repeat 2 的第二次）有意义，
      # 冷路径里 WebP 编解码器首次初始化是另一笔账（实测 Arm64 runner 上 ~800 ms），单独用 1500 ms 兜底。
      - name: Thumbnail smoke
        shell: pwsh
        run: |
          $exe = "out/${{ matrix.arch }}/thumbtest.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $lines = & $exe --dir tests/fixtures/ci --repeat 2 --json
          $lines | ForEach-Object { $_ }
          $rc = $LASTEXITCODE
          "thumbtest exit code: $rc (2 = some fixtures failed, which is expected here)"
          $summary = ($lines | Select-String '^summary').Line -replace '^summary', '' | ConvertFrom-Json
          $webp = ($lines | Select-String 'f_webp\.apk').Line | ConvertFrom-Json
          if ($summary.count -ne 5) { throw "expected 5 fixtures, got $($summary.count)" }
          if ($summary.failed -lt 1 -or $summary.failed -gt 2) {
            throw "expected 1 or 2 failures (f_noicon always fails; f_webp fails only when the image lacks the WebP codec), got $($summary.failed)"
          }
          if ($summary.hotP95 -gt 300) { throw "hotP95 $($summary.hotP95) ms exceeds the 300 ms budget" }
          if ($summary.coldMax -gt 1500) { throw "coldMax $($summary.coldMax) ms exceeds the 1500 ms smoke bound" }
          if ($webp.ok) {
            "WebP: decoded, cold $($webp.first) ms (includes codec initialisation)"
          } else {
            "WebP: not decoded - this image has no WIC WebP codec (expected on windows-latest, not a regression)"
          }
          # thumbtest 对"预期失败"的样本返回 2，而 GitHub 的 pwsh 外壳会在末尾 exit $LASTEXITCODE：
          # 不显式归零的话，断言全过也会被判红。判据只有上面的断言。
          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}
          path: |
            out/${{ matrix.arch }}/apkthumb.dll
            out/${{ matrix.arch }}/apkprop.dll
            out/${{ matrix.arch }}/apkinfo.exe
          if-no-files-found: error

  package:
    name: package
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bin-x64
          path: out/x64

      - uses: actions/download-artifact@v8
        with:
          name: bin-arm64
          path: out/arm64

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { "already installed: $($iscc.Source)"; exit 0 }
          choco install innosetup --no-progress -y
          "installed: $((Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source)"

      - name: Package x64
        shell: cmd
        run: tools\pack.cmd x64

      - name: Package arm64
        shell: cmd
        run: tools\pack.cmd arm64

      - name: Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem out/dist/apk-shell-ext-setup-*.exe | Sort-Object Name
          if ($files.Count -ne 2) { throw "expected 2 installers, got $($files.Count)" }
          # LF 换行：Windows PowerShell 的 Set-Content 会写 CRLF，Linux/macOS 上 sha256sum -c 会读不了
          $text = ($files | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }) -join "`n"
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", $text + "`n", [Text.UTF8Encoding]::new($false))
          Get-Content SHA256SUMS.txt

      # 摊平到一个 staging 目录再上传：upload-artifact 会保留相对路径，
      # 直接传 out/dist/* 会在下载侧变成 dist/out/dist/*（release 时又在 Windows 的路径处理上翻车）。
      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out/dist/apk-shell-ext-setup-*.exe release/
          Copy-Item SHA256SUMS.txt release/
          Get-ChildItem release -File | ForEach-Object { "{0}  {1} bytes" -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: release/*
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: release

      # 不用 gh CLI 建 release：它在 Windows 上会把文件参数当 glob 展开
      # （v1.0.3 首跑两次都栽在 "no matches found for `d`"）。改成这个社区标准 action。
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true
